name: Optimize Supabase Storage

on:
  schedule:
    # Runs every Sunday at 18:00 UTC (Monday 03:00 JST)
    - cron: '0 18 * * 0'
  workflow_dispatch:  # Allow manual trigger

jobs:
  optimize-storage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync

      - name: Run storage optimization
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          uv run python -m backend.src.cli optimize-storage --execute --clean-payloads

      - name: Report status
        if: always()
        run: |
          echo "Storage optimization job completed at $(date)"
