name: Enrich Beer Data (Full Pipeline)

on:
  # This workflow is automatically triggered after "Scrape Beer Data" completes.
  # Since scraping runs every hour (cron: '0 * * * *'), this will also run every hour.
  workflow_run:
    workflows: ["Scrape Beer Data"]
    types:
      - completed
  workflow_dispatch:  # Allow manual trigger

jobs:
  full-enrich:
    runs-on: ubuntu-latest
    # Only run if the triggering workflow was successful
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name != 'workflow_run' }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      
      - name: Install dependencies
        run: uv sync
      
      - name: Run full enrichment pipeline (Gemini → Untappd → Breweries)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          uv run python -m backend.src.cli enrich --limit 150
      
      - name: Report status
        if: always()
        run: |
          echo "Full enrichment pipeline completed at $(date)"
